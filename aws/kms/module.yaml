  controls: [Rotación automática, Seguridad contra bloqueo de política, Ventana de eliminación de 30 días por defecto]
  limits: [Clave de una región, Sin claves asimétricas o material externo]
profiles:
  - name: iam-delegated
    example: examples/iam-delegated/
    fit: Clave de uso dentro de la misma cuenta con la delegación a IAM de AWS KMS.
    pricing:
      meters: []
      shared: [kms-keys, kms-requests]
  - name: customer-policy
    example: examples/customer-policy/
    fit: Clave con política completa para autorizar al servicio o principal requerido.
    pricing:
      meters: []
      shared: [kms-keys, kms-requests]
