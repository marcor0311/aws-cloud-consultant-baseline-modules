# Public AWS tools and the locally installed Terraform Registry server are scoped to this project.
# Enable the authenticated servers after configuring their environment.

web_search = "disabled"

[mcp_servers.baseline-github]
enabled = false
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "BASELINE_GITHUB_TOKEN"

[mcp_servers.baseline-terraform]
enabled = true
command = "./.tools/terraform-mcp-server"
args = ["stdio", "--toolsets", "registry"]

[mcp_servers.baseline-aws-knowledge]
enabled = true
url = "https://aws-mcp.us-east-1.api.aws/mcp"
enabled_tools = ["aws___search_documentation", "aws___read_documentation", "aws___list_regions", "aws___get_regional_availability", "aws___retrieve_skill"]

[mcp_servers.baseline-aws-pricing]
enabled = false
command = "uvx"
args = ["awslabs.aws-pricing-mcp-server"]
env_vars = ["AWS_PROFILE", "AWS_REGION", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE"]

[mcp_servers.baseline-aws-devops]
enabled = false
command = "uvx"
args = ["mcp-proxy-for-aws", "https://connect.aidevops.us-east-1.api.aws/mcp", "--service", "aidevops", "--region", "us-east-1"]
env_vars = ["AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE"]

[mcp_servers.baseline-aws-security]
enabled = false
command = "uvx"
args = ["awslabs.security-agent-mcp-server"]
env_vars = ["AWS_PROFILE", "AWS_REGION", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE"]
