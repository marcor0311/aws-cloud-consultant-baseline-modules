name: Validar módulos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baselines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Inventario y pruebas del agente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.selection.outputs.modules }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Probar catálogo, costos y selección
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements-baseline.txt
          .venv/bin/python -m unittest discover -s tests
      - name: Seleccionar módulos y ejemplos
        id: selection
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            selection="$(.venv/bin/python scripts/select_emulator_cases.py --all)"
          else
            selection="$(.venv/bin/python scripts/select_emulator_cases.py --base "$BASE_COMMIT")"
          fi
          jq -c . <<< "$selection"
          printf 'modules=%s\n' "$(jq -c .modules <<< "$selection")" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform (${{ matrix.module }})
    needs: catalog
    if: ${{ needs.catalog.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.catalog.outputs.modules) }}
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Formato, validación, pruebas y ejemplos
        env:
          BASELINE_MODULE: ${{ matrix.module }}
        run: scripts/validate.sh "$BASELINE_MODULE"

  security:
    name: Seguridad Terraform
    needs: catalog
    if: ${{ needs.catalog.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Instalar Trivy desde su release oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trivy_dir="$RUNNER_TEMP/trivy"
          mkdir -p "$trivy_dir"
          gh release download v0.76.1 --repo aquasecurity/trivy \
            --pattern trivy_0.76.1_Linux-64bit.tar.gz --dir "$trivy_dir"
          printf '%s  %s\n' \
            'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0' \
            "$trivy_dir/trivy_0.76.1_Linux-64bit.tar.gz" | sha256sum --check --strict
          tar -xzf "$trivy_dir/trivy_0.76.1_Linux-64bit.tar.gz" -C "$trivy_dir" trivy
          printf '%s\n' "$trivy_dir" >> "$GITHUB_PATH"
      - name: Analizar módulos con los valores de sus ejemplos
        env:
          SELECTED_MODULES: ${{ needs.catalog.outputs.modules }}
        run: |
          mapfile -t modules < <(jq -r '.[]' <<< "$SELECTED_MODULES")
          scripts/security.sh "${modules[@]}"


  checks:
    name: Validación de baselines
    if: always()
    needs: [catalog, terraform, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultados de todos los módulos
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SELECTED_MODULES: ${{ needs.catalog.outputs.modules }}
        run: |
          check() {
            local title="$1" result="$2" selected="$3"
            case "$result/$selected" in
              success/*) echo "$title pasó" ;;
              skipped/'[]') echo "$title no aplica" ;;
              *) echo "$title falló ($result)"; return 1 ;;
            esac
          }
          failed=0
          check "Catálogo" "$CATALOG_RESULT" required || failed=1
          check "Terraform" "$TERRAFORM_RESULT" "$SELECTED_MODULES" || failed=1
          check "Seguridad" "$SECURITY_RESULT" "$SELECTED_MODULES" || failed=1
          exit "$failed"
